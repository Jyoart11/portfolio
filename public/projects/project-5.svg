<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d1e"/>
      <stop offset="50%" style="stop-color:#0f1b3d"/>
      <stop offset="100%" style="stop-color:#0a0e24"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="vec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="blur5">
      <feGaussianBlur in="SourceGraphic" stdDeviation="50"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg5)"/>

  <!-- Glow orbs -->
  <circle cx="400" cy="280" r="200" fill="#3b82f6" opacity="0.06" filter="url(#blur5)"/>
  <circle cx="800" cy="350" r="220" fill="#7c3aed" opacity="0.06" filter="url(#blur5)"/>

  <!-- Dot grid -->
  <g opacity="0.06" fill="#8b5cf6">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/><circle cx="700" cy="100" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="900" cy="100" r="2"/><circle cx="1000" cy="100" r="2"/><circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="600" cy="200" r="2"/><circle cx="700" cy="200" r="2"/><circle cx="800" cy="200" r="2"/><circle cx="900" cy="200" r="2"/><circle cx="1000" cy="200" r="2"/><circle cx="1100" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="400" cy="300" r="2"/><circle cx="500" cy="300" r="2"/><circle cx="600" cy="300" r="2"/><circle cx="700" cy="300" r="2"/><circle cx="800" cy="300" r="2"/><circle cx="900" cy="300" r="2"/><circle cx="1000" cy="300" r="2"/><circle cx="1100" cy="300" r="2"/>
    <circle cx="100" cy="400" r="2"/><circle cx="200" cy="400" r="2"/><circle cx="300" cy="400" r="2"/><circle cx="400" cy="400" r="2"/><circle cx="500" cy="400" r="2"/><circle cx="600" cy="400" r="2"/><circle cx="700" cy="400" r="2"/><circle cx="800" cy="400" r="2"/><circle cx="900" cy="400" r="2"/><circle cx="1000" cy="400" r="2"/><circle cx="1100" cy="400" r="2"/>
    <circle cx="100" cy="500" r="2"/><circle cx="200" cy="500" r="2"/><circle cx="300" cy="500" r="2"/><circle cx="400" cy="500" r="2"/><circle cx="500" cy="500" r="2"/><circle cx="600" cy="500" r="2"/><circle cx="700" cy="500" r="2"/><circle cx="800" cy="500" r="2"/><circle cx="900" cy="500" r="2"/><circle cx="1000" cy="500" r="2"/><circle cx="1100" cy="500" r="2"/>
  </g>

  <!-- Document chunk visualization (left side) -->
  <!-- Document -->
  <rect x="120" y="140" width="180" height="240" rx="10" fill="#111a38" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="145" y="170" width="130" height="8" rx="4" fill="#3b82f6" opacity="0.2"/>
  <rect x="145" y="190" width="100" height="8" rx="4" fill="#3b82f6" opacity="0.15"/>
  <rect x="145" y="210" width="120" height="8" rx="4" fill="#3b82f6" opacity="0.12"/>
  <!-- Chunk dividers -->
  <line x1="140" y1="235" x2="280" y2="235" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
  <rect x="145" y="248" width="110" height="8" rx="4" fill="#8b5cf6" opacity="0.2"/>
  <rect x="145" y="268" width="130" height="8" rx="4" fill="#8b5cf6" opacity="0.15"/>
  <line x1="140" y1="290" x2="280" y2="290" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
  <rect x="145" y="303" width="90" height="8" rx="4" fill="#8b5cf6" opacity="0.18"/>
  <rect x="145" y="323" width="120" height="8" rx="4" fill="#8b5cf6" opacity="0.12"/>
  <text x="210" y="400" font-family="Arial" font-size="13" fill="#64748b" text-anchor="middle">Semantic Chunking</text>

  <!-- Arrow 1 -->
  <path d="M320 260 L400 260" stroke="url(#accent5)" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead)"/>
  <polygon points="395,255 405,260 395,265" fill="#8b5cf6" opacity="0.5"/>

  <!-- Embedding visualization (center) -->
  <rect x="420" y="160" width="200" height="200" rx="14" fill="#111a38" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Vector dots -->
  <circle cx="470" cy="220" r="6" fill="#7c3aed" opacity="0.7"/>
  <circle cx="520" cy="200" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="555" cy="250" r="7" fill="#06b6d4" opacity="0.5"/>
  <circle cx="490" cy="280" r="5" fill="#a78bfa" opacity="0.6"/>
  <circle cx="540" cy="310" r="6" fill="#7c3aed" opacity="0.5"/>
  <circle cx="580" cy="210" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="460" cy="310" r="5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="510" cy="260" r="8" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="570" cy="290" r="5" fill="#a78bfa" opacity="0.5"/>
  <!-- Connecting lines between some dots -->
  <line x1="470" y1="220" x2="520" y2="200" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <line x1="520" y1="200" x2="555" y2="250" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <line x1="510" y1="260" x2="540" y2="310" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <line x1="490" y1="280" x2="510" y2="260" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <text x="520" y="400" font-family="Arial" font-size="13" fill="#64748b" text-anchor="middle">Vector Embeddings</text>

  <!-- Arrow 2 -->
  <path d="M640 260 L720 260" stroke="url(#accent5)" stroke-width="2" opacity="0.5"/>
  <polygon points="715,255 725,260 715,265" fill="#8b5cf6" opacity="0.5"/>

  <!-- Retrieval + Answer (right side) -->
  <rect x="740" y="150" width="340" height="100" rx="12" fill="#111a38" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="770" y="185" font-family="Arial" font-size="13" fill="#06b6d4" opacity="0.7">Q: How does the system work?</text>
  <rect x="770" y="200" width="200" height="6" rx="3" fill="#06b6d4" opacity="0.15"/>
  <rect x="770" y="215" width="160" height="6" rx="3" fill="#06b6d4" opacity="0.1"/>

  <rect x="740" y="270" width="340" height="120" rx="12" fill="#111a38" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="770" y="305" font-family="Arial" font-size="13" fill="#22c55e" opacity="0.7">A: Based on retrieved context...</text>
  <rect x="770" y="320" width="260" height="6" rx="3" fill="#22c55e" opacity="0.15"/>
  <rect x="770" y="335" width="220" height="6" rx="3" fill="#22c55e" opacity="0.12"/>
  <rect x="770" y="350" width="240" height="6" rx="3" fill="#22c55e" opacity="0.08"/>
  <text x="910" y="420" font-family="Arial" font-size="13" fill="#64748b" text-anchor="middle">Retrieval + Generation</text>

  <!-- Evaluation loop icon -->
  <path d="M910 440 C940 440, 960 460, 960 480 C960 500, 940 520, 910 520 C880 520, 860 500, 860 480" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="858,475 862,485 868,477" fill="#f59e0b" opacity="0.4"/>
  <text x="910" y="545" font-family="Arial" font-size="11" fill="#f59e0b" text-anchor="middle" opacity="0.5">Eval Loop</text>

  <!-- Title -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="white" text-anchor="middle" letter-spacing="1">RAG Q&amp;A Engine</text>
  <text x="600" y="585" font-family="Arial, sans-serif" font-size="18" fill="#818cf8" text-anchor="middle" opacity="0.8">Semantic Chunking · Vector Retrieval · Evaluation</text>

  <!-- Top accent line -->
  <rect x="400" y="520" width="400" height="2" rx="1" fill="url(#accent5)" opacity="0.3"/>
</svg>

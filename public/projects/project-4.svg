<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0118"/>
      <stop offset="50%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#0d0628"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur4">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Glow orbs -->
  <circle cx="300" cy="250" r="200" fill="#7c3aed" opacity="0.08" filter="url(#blur4)"/>
  <circle cx="900" cy="400" r="180" fill="#06b6d4" opacity="0.06" filter="url(#blur4)"/>
  <circle cx="600" cy="300" r="150" fill="#8b5cf6" opacity="0.05" filter="url(#blur4)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Chat bubbles illustration -->
  <!-- Bot bubble -->
  <rect x="180" y="160" width="340" height="80" rx="16" fill="#1e1145" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="220" cy="200" r="16" fill="#7c3aed" opacity="0.6"/>
  <text x="215" y="205" font-family="Arial" font-size="14" fill="white" text-anchor="middle">AI</text>
  <rect x="250" y="185" width="180" height="10" rx="5" fill="#7c3aed" opacity="0.25"/>
  <rect x="250" y="205" width="130" height="10" rx="5" fill="#7c3aed" opacity="0.15"/>

  <!-- User bubble -->
  <rect x="280" y="260" width="300" height="70" rx="16" fill="#0e1a3a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="310" y="282" width="200" height="10" rx="5" fill="#06b6d4" opacity="0.2"/>
  <rect x="310" y="302" width="140" height="10" rx="5" fill="#06b6d4" opacity="0.12"/>

  <!-- Bot response bubble -->
  <rect x="180" y="350" width="380" height="90" rx="16" fill="#1e1145" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="220" cy="395" r="16" fill="#7c3aed" opacity="0.6"/>
  <text x="215" y="400" font-family="Arial" font-size="14" fill="white" text-anchor="middle">AI</text>
  <rect x="250" y="375" width="240" height="10" rx="5" fill="#7c3aed" opacity="0.25"/>
  <rect x="250" y="395" width="180" height="10" rx="5" fill="#7c3aed" opacity="0.15"/>
  <rect x="250" y="415" width="210" height="10" rx="5" fill="#7c3aed" opacity="0.1"/>

  <!-- File format icons on right -->
  <!-- PDF -->
  <rect x="750" y="170" width="90" height="110" rx="8" fill="#1e1145" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="795" y="235" font-family="Arial" font-weight="bold" font-size="16" fill="#ef4444" text-anchor="middle" opacity="0.7">PDF</text>

  <!-- URL -->
  <rect x="860" y="170" width="90" height="110" rx="8" fill="#1e1145" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="905" y="235" font-family="Arial" font-weight="bold" font-size="16" fill="#3b82f6" text-anchor="middle" opacity="0.7">URL</text>

  <!-- DOCX -->
  <rect x="970" y="170" width="90" height="110" rx="8" fill="#1e1145" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="1015" y="235" font-family="Arial" font-weight="bold" font-size="14" fill="#2563eb" text-anchor="middle" opacity="0.7">DOCX</text>

  <!-- CSV -->
  <rect x="750" y="300" width="90" height="110" rx="8" fill="#1e1145" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="795" y="365" font-family="Arial" font-weight="bold" font-size="16" fill="#22c55e" text-anchor="middle" opacity="0.7">CSV</text>

  <!-- IMG -->
  <rect x="860" y="300" width="90" height="110" rx="8" fill="#1e1145" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="905" y="365" font-family="Arial" font-weight="bold" font-size="16" fill="#f59e0b" text-anchor="middle" opacity="0.7">IMG</text>

  <!-- TXT -->
  <rect x="970" y="300" width="90" height="110" rx="8" fill="#1e1145" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="1015" y="365" font-family="Arial" font-weight="bold" font-size="16" fill="#a78bfa" text-anchor="middle" opacity="0.7">TXT</text>

  <!-- Arrow connecting files to chat -->
  <path d="M730 300 L680 300" stroke="url(#accent4)" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="white" text-anchor="middle" letter-spacing="1">Icognito</text>
  <text x="600" y="585" font-family="Arial, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" opacity="0.8">AI Chatbot Builder · 6-Format Ingestion</text>

  <!-- Top accent line -->
  <rect x="400" y="520" width="400" height="2" rx="1" fill="url(#accent4)" opacity="0.3"/>
</svg>
